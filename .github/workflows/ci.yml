name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # The simulation code pins native BLAS/OpenMP threading to 1 for
      # reproducibility; tests assume the same environment.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - name: Configure runner-local paths
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/matplotlib" \
            "$RUNNER_TEMP/uv-cache" \
            "$RUNNER_TEMP/uv-python"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python and pinned dependencies
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Configure runner-local paths
        shell: bash
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uv-cache"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint and prospective format
        run: |
          uvx ruff==0.16.3 check .
          uvx ruff==0.16.3 format --check .
